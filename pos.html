<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نقطة بيع - متجر أدوات تنظيف السيارات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .pos {display:flex;gap:12px}
    .products {flex:2}
    .cart {flex:1;min-width:300px}
    .product-card{padding:8px;border:1px solid #e6e9ee;border-radius:6px;margin-bottom:8px;background:#fff}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
    .cart-list{list-style:none;padding:0;margin:0}
    .cart-item{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #f0f2f5}
    .totals{padding:8px;font-weight:700}
    .checkout-row{display:flex;gap:8px}
    .receipt{white-space:pre-wrap;background:#fff;padding:12px;border-radius:6px;border:1px solid #e6e9ee;margin-top:8px}
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand"><strong>نقطة بيع - المتجر</strong></div>
      <div class="top-actions">
        <button id="loginBtn" class="ghost">تسجيل دخول</button>
        <button id="cartBtn" class="ghost">سلة <span id="cartCount" class="badge">0</span></button>
      </div>
    </div>
    <h1>نقطة بيع - المتجر</h1>
    <p class="muted">واجهة سريعة للعميل لإتمام المشتريات</p>
  </header>
  <div id="globalCartPanel" class="card hidden" style="position:fixed;top:64px;right:20px;width:360px;z-index:60">
    <h3 style="margin:0 0 8px">سلة المشتريات</h3>
    <div id="globalCartItems" style="max-height:400px;overflow:auto"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="checkoutFromCart">الدفع</button>
      <button id="clearGlobalCart" class="ghost">تفريغ السلة</button>
    </div>
  </div>
  <!-- Auth modal (blocks browsing until login/register) -->
  <div id="authModal" class="auth-modal hidden">
    <div class="auth-card">
      <h2>تسجيل الدخول أو إنشاء حساب</h2>
      <div class="auth-tabs">
        <button id="tabLogin" class="ghost">دخول</button>
        <button id="tabRegister" class="ghost">تسجيل</button>
      </div>
      <div id="authBody">
        <div id="loginPane">
          <input id="loginUser" placeholder="اسم المستخدم">
          <input id="loginPass" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)">
          <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="rememberMe" type="checkbox"> تذكرني</label>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="doLogin">دخول</button>
            <a href="#" id="forgotLink" style="margin-left:auto;font-size:13px">نسيت كلمة المرور؟</a>
          </div>
        </div>
        <div id="registerPane" class="hidden">
          <input id="regUser" placeholder="اسم المستخدم جديد">
          <input id="regPass" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)">
          <input id="regPass2" type="password" placeholder="تأكيد كلمة المرور">
          <label style="display:flex;align-items:center;gap:8px;margin-top:8px">دور المستخدم:
            <select id="regRole">
              <option value="customer">زبون</option>
              <option value="cashier">كاشير</option>
              <option value="admin">مدير</option>
            </select>
          </label>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="doRegister">إنشاء حساب</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <main class="container pos">
    <div class="products card">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <input id="posSearch" placeholder="ابحث عن منتج أو SKU" style="flex:1">
        <input id="posQtyDefault" type="number" value="1" style="width:80px" title="الكمية الافتراضية عند الإضافة">
        <button id="clearSearch" class="ghost">مسح</button>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </div>

    <aside class="cart card">
      <h2>العربة</h2>
      <ul id="cartList" class="cart-list"></ul>
      <div class="totals">
        <div>المجموع: <span id="subtotal">0.00</span></div>
        <div>الضريبة (0%): <span id="tax">0.00</span></div>
        <div>الإجمالي: <span id="total">0.00</span></div>
      </div>

      <div style="margin-top:8px">
        <div style="display:flex;gap:8px;margin-top:8px;flex-direction:column">
          <div style="display:flex;gap:8px;align-items:center">
            <label style="width:120px">نسبة الضريبة %</label>
            <input id="taxPercent" type="number" value="0" step="0.1" style="width:100px">
            <label style="width:80px">خصم (مبلغ)</label>
            <input id="discount" type="number" value="0" step="0.01" style="width:100px">
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <label style="width:120px">مبلغ الدفع</label>
            <input id="paidAmount" type="number" value="0" step="0.01" style="width:140px">
            <div style="margin-left:auto">الباقي: <strong id="change">0.00</strong></div>
          </div>
        </div>
        <div class="checkout-row">
          <select id="paymentMethod">
            <option value="cash">نقداً</option>
            <option value="card">بطاقة</option>
          </select>
          <input id="customerName" placeholder="اسم العميل (اختياري)">
        </div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button id="checkoutBtn">إنهاء البيع</button>
          <button id="clearCart" class="ghost">تفريغ العربة</button>
        </div>
      </div>

      <div id="receiptWrap" class="hidden">
        <h3>إيصال</h3>
        <div id="receipt" class="receipt"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="printReceipt">طباعة</button>
          <button id="closeReceipt" class="ghost">إغلاق</button>
        </div>
      </div>

    </aside>
  </main>

  <script src="pos.js"></script>
</body>
</html>
